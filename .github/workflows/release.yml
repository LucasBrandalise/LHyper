# Gera o instalador (LHyper-<versão>-Setup.exe) e a versão portátil (.zip)
# e publica uma Release no GitHub.
#
# Lançar uma versão:
#   1. Atualize APP_VERSION em app/core/constants.py (ex.: "0.2.7") e faça commit.
#   2. git tag v0.2.7
#   3. git push origin main --tags
#
# Também pode ser rodado manualmente (aba Actions → Release → Run workflow):
# nesse caso os arquivos ficam só como artefatos do workflow, sem criar Release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Ler versão do app
        id: version
        shell: pwsh
        run: |
          $version = python -c "from app.core.constants import APP_VERSION; print(APP_VERSION)"
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            Write-Error "A tag $env:GITHUB_REF_NAME não bate com APP_VERSION ($version). Atualize app/core/constants.py."
            exit 1
          }

      # O yt-dlp não é fixado de propósito: cada build sai com a versão mais nova,
      # que é a que acompanha as mudanças do YouTube.
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller==6.22.3"

      - name: Testes
        run: python -m unittest discover -s tests -t . -v

      - name: Build do executável
        run: python -m PyInstaller LHyper.spec --noconfirm

      # ------------------------------------------------------------ instalador
      - name: Gerar instalador
        id: installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python installer\make_wizard_images.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\LHyper.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "setup=dist\LHyper-${{ steps.version.outputs.version }}-Setup.exe" >> $env:GITHUB_OUTPUT

      - name: Testar instalador (instalar, abrir, desinstalar)
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\LHyper"
          $desktopLnk = Join-Path ([Environment]::GetFolderPath("Desktop")) "LHyper.lnk"
          $startLnk = Join-Path ([Environment]::GetFolderPath("Programs")) "LHyper.lnk"
          $dataDir = Join-Path $env:LOCALAPPDATA "LHyper"
          function Fail($message) { Write-Error $message; exit 1 }

          $setup = Start-Process "${{ steps.installer.outputs.setup }}" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { Fail "O instalador terminou com código $($setup.ExitCode)." }
          if (-not (Test-Path "$installDir\LHyper.exe")) { Fail "LHyper.exe não foi instalado em $installDir." }
          if (-not (Test-Path $desktopLnk)) { Fail "O atalho da área de trabalho não foi criado." }
          if (-not (Test-Path $startLnk)) { Fail "O atalho do menu Iniciar não foi criado." }

          $app = Start-Process "$installDir\LHyper.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { Fail "O app instalado encerrou logo após abrir (código $($app.ExitCode))." }
          if (-not (Test-Path "$dataDir\downloads.db")) { Fail "O app instalado não criou o banco em $dataDir." }
          if (Test-Path "$installDir\app_data") { Fail "O app instalado gravou dados na pasta de instalação." }
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 2

          $uninstall = Start-Process "$installDir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          Start-Sleep -Seconds 3
          if ($uninstall.ExitCode -ne 0) { Fail "O desinstalador terminou com código $($uninstall.ExitCode)." }
          if (Test-Path "$installDir\LHyper.exe") { Fail "O desinstalador não removeu o app." }
          if ((Test-Path $desktopLnk) -or (Test-Path $startLnk)) { Fail "O desinstalador não removeu os atalhos." }

      # ------------------------------------------------------------ portátil
      - name: Preparar e testar versão portátil
        shell: pwsh
        run: |
          # O marcador faz o app guardar downloads e histórico na própria pasta.
          Set-Content -Path "dist\LHyper\portable.txt" -Encoding utf8 -Value "Versão portátil do LHyper: os downloads e o histórico ficam nesta pasta."
          $app = Start-Process -FilePath "dist\LHyper\LHyper.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) {
            Write-Error "LHyper.exe portátil encerrou logo após abrir (código $($app.ExitCode))."
            exit 1
          }
          if (-not (Test-Path "dist\LHyper\app_data\downloads.db")) {
            Write-Error "LHyper.exe portátil não criou o banco ao lado do executável."
            exit 1
          }
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 2
          # Não distribuir dados gerados pelo teste.
          Remove-Item -Recurse -Force "dist\LHyper\app_data", "dist\LHyper\downloads" -ErrorAction SilentlyContinue

      - name: Compactar versão portátil
        id: package
        shell: pwsh
        run: |
          $zip = "dist\LHyper-${{ steps.version.outputs.version }}-portatil.zip"
          Compress-Archive -Path "dist\LHyper" -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: LHyper-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.installer.outputs.setup }}
            ${{ steps.package.outputs.zip }}

      - name: Publicar Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $notes = @"
          ## Como instalar

          1. **Baixe** o instalador: clique em **LHyper-$version-Setup.exe**, logo abaixo, em *Assets*. Não clique em "Source code".
          2. **Abra** o arquivo baixado (na pasta Downloads). Se aparecer *"O Windows protegeu o computador"*, clique em **Mais informações → Executar assim mesmo**.
          3. Clique em **Avançar** até o fim. Pronto: o LHyper aparece na **área de trabalho** e no **menu Iniciar**.

          Os vídeos e músicas baixados ficam em **Downloads → LHyper**.

          **MP3:** para converter para MP3, instale o FFmpeg: clique com o botão direito no Iniciar → **Terminal** → cole ``winget install Gyan.FFmpeg`` → Enter.

          **Atualizar:** baixe e abra o instalador da versão nova. Seus downloads e o histórico são mantidos.

          **Versão portátil** (sem instalar, para pendrive): baixe **LHyper-$version-portatil.zip**, clique com o botão direito → **Extrair Tudo...** e abra o **LHyper.exe** da pasta extraída. Nessa versão os downloads ficam dentro da própria pasta.

          Guia completo: https://github.com/LucasBrandalise/LHyper#como-instalar-sem-precisar-entender-de-github
          "@
          gh release create "$env:GITHUB_REF_NAME" "${{ steps.installer.outputs.setup }}" "${{ steps.package.outputs.zip }}" `
            --title "LHyper $env:GITHUB_REF_NAME" `
            --notes "$notes" `
            --generate-notes
